[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-rag-chatbot"
version = "0.2.0"
description = "Production RAG chatbot for crop advisory questions (Bangla/English), LangGraph + Ollama + Chroma"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "langchain-core>=0.3,<2",
    "langchain-groq>=1.0,<2",
    "langchain-ollama>=0.2,<2",
    "langchain-chroma>=0.1.4,<2",
    "langgraph>=0.2,<2",
    "chromadb>=0.5,<2",
    "rank-bm25>=0.2.2,<1",
    "python-dotenv>=1.0,<2",
    "tenacity>=9.0,<10",
    "avro>=1.11,<2",
]

[project.scripts]
crop-rag-ingest = "app.ingestion.loader:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]
reranker = [
    "FlagEmbedding>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
