# Cloud Build config for aunkur-chat-api + local retrieval model server.
#
# Produces two images that are deployed as TWO containers inside ONE Azure
# Container App replica:
#   - chat-bot-api: FastAPI / RAG orchestration
#   - chat-retrieval: BGE-M3 embedding + BGE reranker v2 M3 via Infinity
#
# Redis and Qdrant remain external/shared infrastructure.

substitutions:
  _REGION: us-central1
  _REPO: development
  _API_IMAGE: chat-bot-api
  _RETRIEVAL_IMAGE: chat-retrieval
  _PROJECT_ID: upheld-setting-423215-p7

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_API_IMAGE}:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_RETRIEVAL_IMAGE}:latest"

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        DOCKER_BUILDKIT=1 docker build \
          -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_API_IMAGE}:latest" \
          -f Dockerfile .

  - id: build-retrieval
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        DOCKER_BUILDKIT=1 docker build \
          -t "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_RETRIEVAL_IMAGE}:latest" \
          -f Dockerfile.retrieval .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_API_IMAGE}:latest"
    waitFor: ["build-api"]

  - id: push-retrieval
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_RETRIEVAL_IMAGE}:latest"
    waitFor: ["build-retrieval"]

options:
  machineType: E2_HIGHCPU_8

timeout: 3600s
