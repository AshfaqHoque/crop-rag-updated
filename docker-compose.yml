services:
  app:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "10.30.0.2:host-gateway"
    environment:
      APP_ENV: docker
      LOG_LEVEL: INFO
      CHAT_PROVIDER: vllm
      VLLM_BASE_URL: http://10.30.0.2:8091/v1
      VLLM_CHAT_MODEL: gemma4:12b
      VLLM_API_KEY: ${VLLM_API_KEY:-not-needed}
      OLLAMA_BASE_URL: http://10.30.0.2:11434
      EMBED_MODEL: bge-m3:latest
      CHROMA_HOST: 10.30.0.2
      CHROMA_PORT: 8001
      CHROMA_COLLECTION: crop_knowledge_base
      CHROMA_COMPANY_COLLECTION: company_knowledge_base
      CHROMA_SOIL_TEST_COLLECTION: soil_test_knowledge_base   
      CROP_REGISTRY_PATH: /app/data/crops.json
      RERANKER_URL: http://10.30.0.2:8090/rerank
      CHECKPOINT_BACKEND: memory
      REDIS_URL: redis://redis:6379/0
      LANGSMITH_TRACING: ${LANGSMITH_TRACING_DOCKER:-false}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  ui:
    build: .
    restart: unless-stopped
    environment:
      API_URL: http://app:8000/api/v1/chat/stream
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    depends_on:
      app:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data: